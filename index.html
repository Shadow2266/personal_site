        function renderPatents() {
            const d = currentDict.patents;
            const filters = d.filters;
            
            const filteredPatents = DATA.PATENTS.filter((p) => {
                const q = currentPatentsQuery.trim().toLowerCase();
                const fullText = `${p.title} ${p.code} ${p.status} ${p.type}`.toLowerCase();
                const okQuery = !q || fullText.includes(q);
                
                const okFilter =
                    currentPatentsFilter === "all" ? true :
                    currentPatentsFilter === "inUse" ? p.status.includes("本院使用中") :
                    currentPatentsFilter === "transfer" ? (p.status.includes("技轉") || p.status.includes("商品上市")) :
                    currentPatentsFilter === "proto" ? p.status.includes("樣本試作") :
                    currentPatentsFilter === "applied" ? p.status.includes("產品應用") :
                    currentPatentsFilter === "us" ? p.code.toUpperCase().includes("US") : 
                    true;
                return okQuery && okFilter;
            });

            const filterButtonsHtml = Object.entries(filters).map(([k, label]) => `
                <button
                    onclick="setPatentsFilter('${k}')"
                    class="rounded-full border px-4 py-1.5 text-base ${currentPatentsFilter === k ? "bg-teal-700 text-white border-teal-700" : "text-gray-700 border-gray-300 hover:bg-gray-50"}"
                >
                    ${label}
                </button>
            `).join('');

            const patentCardsHtml = filteredPatents.map(p => {
                const statusTags = p.status
                    .split(/[、\/()]|\s/)
                    .map(tag => tag.trim())
                    .filter(tag => tag !== '')
                    .map(tagHtml)
                    .join('');

                return `
                    <article class="rounded-2xl border bg-white p-5 shadow-sm hover:shadow-md transition-shadow">
                        <div class="flex items-center justify-between">
                            <h3 class="font-semibold text-gray-900 text-lg">${p.title}</h3>
                            ${tagHtml(p.type)}
                        </div>
                        <p class="text-base text-gray-500 mt-1">${p.code}</p>
                        <div class="mt-3 flex items-center gap-2 flex-wrap">
                            ${statusTags}
                        </div>
                    </article>
                `;
            }).join('');

            const content = `
                <div class="flex flex-col md:flex-row gap-3 md:items-center md:justify-between mb-4">
                    <input
                        id="patents-search-input"
                        value="${currentPatentsQuery}"
                        oninput="setPatentsQuery(this.value)"
                        placeholder="${d.searchPlaceholder}"
                        class="w-full md:w-1/2 rounded-xl border border-gray-300 px-4 py-2 text-base focus:outline-none focus:ring-2 focus:ring-teal-600"
                    />
                    <div class="flex flex-wrap gap-2">
                        ${filterButtonsHtml}
                    </div>
                </div>
                <p class="text-base text-gray-500 mb-3">共 ${filteredPatents.length} / ${DATA.PATENTS.length} 項</p>
                <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    ${patentCardsHtml}
                </div>
            `;
            document.getElementById('patents-container').innerHTML = sectionHtml('patents', d.heading, content);
        }

        function setPatentsQuery(query) {
            currentPatentsQuery = query;

                                <div class="hidden sm:block absolute right-[-1.65rem] top-6 w-4 h-4 bg-teal-500 rounded-full border-4 border-white z-10"></div>
                            </div>

                            <!-- 右側：內容卡片 (佔滿剩餘寬度) -->
                            <div class="relative bg-white border rounded-2xl shadow-sm p-6 w-full flex-1">
                                <!-- 箭頭 (裝飾) -->
                                <div class="hidden sm:block absolute left-[-0.6rem] top-6 w-4 h-4 bg-white border-b border-l border-gray-200 rotate-45"></div>
                                
                                <!-- 內容標籤置中 -->
                                <div class="flex flex-wrap justify-center gap-3">
                                    ${notesHtml}
                                </div>
                            </div>
                        </div>
                    </li>
                `;
            }).join('');

            const content = `
                <div class="relative">
                    <!-- 垂直時間線 -->
                    <div class="hidden sm:block absolute left-[6.5rem] top-4 bottom-4 w-0.5 bg-gray-200"></div>
                    <ul class="space-y-6">
                        ${milestonesHtml}
                    </ul>
                </div>
            `;
            document.getElementById('milestones-container').innerHTML = sectionHtml('milestones', d.heading, content);
        }

        function renderAwards() {
            const d = currentDict.awards;
            const awardsHtml = DATA.AWARDS.map(a => `
                <div class="rounded-2xl border bg-white p-5 shadow-sm">
                    <div class="text-4xl">🏆</div>
                    <div class="mt-2 text-base text-gray-500">${a.year}</div>
                    <div class="font-semibold text-gray-900 text-lg">${a.title}</div>
                </div>
            `).join('');

            const content = `<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">${awardsHtml}</div>`;
            document.getElementById('awards-container').innerHTML = sectionHtml('awards', d.heading, content);
        }

        function renderSpeaking() {
            const d = currentDict.speaking;
            const categoriesHtml = Object.entries(d.categories).map(([cat, items]) => {
                const listItems = items.map(t => `<li class="list-disc list-inside text-base">${t}</li>`).join('');
                return `
                    <div class="p-5 rounded-2xl border bg-white shadow-sm">
                        <h3 class="font-semibold text-teal-700 mb-3 text-xl">${cat}</h3>
                        <ul class="space-y-2 text-gray-700">
                            ${listItems}
                        </ul>
                    </div>
                `;
            }).join('');

            const content = `
                <div class="grid md:grid-cols-3 gap-6">${categoriesHtml}</div>
                <div class="mt-6">
                    <a href="#contact" class="inline-block rounded-2xl bg-teal-700 text-white px-6 py-3 text-base font-semibold shadow hover:bg-teal-800">
                        ${d.cta}
                    </a>
                </div>
            `;
            document.getElementById('speaking-container').innerHTML = sectionHtml('speaking', d.heading, content);
        }

        function renderContact() {
            const d = currentDict.contact;
            const previewHtml = contactPreviewHtml;
            
            const content = `
                <p class="text-base text-gray-500 mb-3">${d.note}</p>
                <p class="text-base text-teal-700 mb-4">${d.recipient}</p>
                <form id="contact-form" onsubmit="handleGenerate(event)" class="grid md:grid-cols-2 gap-4 bg-white border rounded-2xl p-6 shadow-sm">
                    <div>
                        <label for="contact-name" class="text-base text-gray-700">${d.name}</label>
                        <input id="contact-name" name="name" required class="mt-1 w-full rounded-xl border px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-teal-600" />
                    </div>
                    <div>
                        <label for="contact-org" class="text-base text-gray-700">${d.org}</label>
                        <input id="contact-org" name="org" class="mt-1 w-full rounded-xl border px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-teal-600" />
                    </div>
                    <div>
                        <label for="contact-email" class="text-base text-gray-700">${d.email}</label>
                        <input type="email" id="contact-email" name="email" required class="mt-1 w-full rounded-xl border px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-teal-600" />
                    </div>
                    <div>
                        <label for="contact-subject" class="text-base text-gray-700">${d.subject}</label>
                        <input id="contact-subject" name="subject" required class="mt-1 w-full rounded-xl border px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-teal-600" />
                    </div>
                    <div class="md:col-span-2">
                        <label for="contact-message" class="text-base text-gray-700">${d.message}</label>
                        <textarea id="contact-message" name="message" rows="5" class="mt-1 w-full rounded-xl border px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-teal-600"></textarea>
                    </div>
                    <div class="md:col-span-2 flex gap-3">
                        <button type="submit" id="contact-submit-btn" class="rounded-2xl bg-teal-700 text-white px-6 py-3 text-base font-semibold shadow hover:bg-teal-800 transition-colors">
                            ${d.submit}
                        </button>
                        <button type="button" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })" class="rounded-2xl border border-gray-300 px-6 py-3 text-base font-semibold text-gray-700 hover:bg-gray-50 transition-colors">↑ Top</button>
                    </div>
                </form>

                <div id="contact-preview-container" class="mt-6">
                    ${previewHtml}
                </div>
            `;
            document.getElementById('contact-container').innerHTML = sectionHtml('contact', d.heading, content);
        }

        async function handleGenerate(e) {
            e.preventDefault();
            const form = e.currentTarget;
            const submitBtn = document.getElementById('contact-submit-btn');

            const name = form.elements['name'].value || "";
            const org = form.elements['org'].value || "";
            const email = form.elements['email'].value || "";
            const subject = form.elements['subject'].value || "";
            const message = form.elements['message'].value || "";

            const summary = `主題: ${subject}\n姓名: ${name}\n單位: ${org}\nEmail: ${email}\n\n需求:\n${message}`;

            const previewHtmlContent = `
                <div id="contact-preview-box" class="p-4 rounded-2xl border bg-gray-50">
                    <h4 class="font-semibold text-gray-900 mb-2 text-lg">${currentDict.contact.heading}</h4>
                    <pre class="whitespace-pre-wrap text-base text-gray-800 p-3 bg-white rounded-lg border border-dashed">${summary}</pre>
                </div>
            `;
            document.getElementById('contact-preview-container').innerHTML = previewHtmlContent;
            contactPreviewHtml = previewHtmlContent; 

            let copySuccess = false;
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(summary);
                    copySuccess = true;
                }
            } catch (err) {
                console.error("無法複製到剪貼簿:", err);
            }

            if (copySuccess) {
                const originalText = currentDict.contact.submit;
                submitBtn.textContent = currentDict.contact.copied;
                submitBtn.classList.add('bg-green-600', 'hover:bg-green-700');
                
                setTimeout(() => {
                    const contactContainer = document.getElementById('contact-container');
                    if (contactContainer) {
                        window.scrollTo({
                            top: contactContainer.offsetTop + contactContainer.offsetHeight,
                            behavior: 'smooth'
                        });
                    }
                }, 100);

                setTimeout(() => {
                    submitBtn.textContent = originalText;
                    submitBtn.classList.remove('bg-green-600', 'hover:bg-green-700');
                }, 3000);
            }
        }

        window.onload = function() {
            const mainContent = document.createElement('div');
            mainContent.id = 'main-content-container';
            mainContent.className = 'min-h-screen bg-white text-gray-900';

            const headerContainer = document.createElement('div');
            headerContainer.id = 'header-container';
            mainContent.appendChild(headerContainer);
            
            const mainTag = document.createElement('main');
            mainTag.innerHTML = `
                <div id="hero-container"></div>
                <div id="about-container"></div>
                <div id="patents-container"></div>
                <div id="milestones-container"></div>
                <div id="awards-container"></div>
                <div id="speaking-container"></div>
                <div id="contact-container"></div>
            `;
            mainContent.appendChild(mainTag);

            const footer = document.createElement('footer');
            footer.className = 'py-10 border-t mt-8 bg-gray-50';
            footer.innerHTML = `
                <div class="max-w-6xl mx-auto px-4 text-base text-gray-500 flex items-center justify-between">
                    <span>© ${new Date().getFullYear()} Ying-Li Lee</span>
                    <span class="hidden sm:inline">Science × Art × Humanity</span>
                </div>
            `;
            mainContent.appendChild(footer);

            document.body.appendChild(mainContent);
            
            renderAll(); 
        };
    </script>
</body>
</html>
